[package]
name = "tba"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Kubernetes time based autoscaler: time-of-week replica floors that HPA and KEDA can scale above"
license = "MIT"
repository = "https://github.com/alexandernicholson/tba"
keywords = ["kubernetes", "autoscaler", "controller", "operator", "schedule"]
categories = ["command-line-utilities"]

[dependencies]
bytes = "1.12.2"
clap = { version = "4", features = ["derive", "env"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1.5"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
# Bundled tzdb: distroless/scratch images have no /usr/share/zoneinfo.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
k8s-openapi = { version = "0.29", features = ["v1_33", "schemars"] }
kube = { version = "5.1", default-features = false, features = ["client", "rustls-tls", "ring", "runtime", "derive"] }
kube-lease-manager = "0.13"
# Enables `Controller::for_stream`, needed to filter watch events by `metadata.generation`.
kube-runtime = { version = "5.1", default-features = false, features = ["unstable-runtime-stream-control"] }
prometheus-client = "0.26"
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.2.0"
serde_json = "1.0.154"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "signal", "net", "time", "sync"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
# A panic anywhere leaves the controller in an unknown state: exit and let the kubelet restart it.
panic = "abort"
strip = "symbols"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "process"] }

# `cargo build --profile profiling`: release optimisations with symbols for samply/flamegraph.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
panic = "unwind"
