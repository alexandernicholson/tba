apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: timebasedautoscalers.tba.alexandernicholson.github.io
spec:
  group: tba.alexandernicholson.github.io
  names:
    categories:
    - autoscaling
    kind: TimeBasedAutoscaler
    plural: timebasedautoscalers
    shortNames:
    - tba
    singular: timebasedautoscaler
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Kind of the scale target
      jsonPath: .spec.scaleTargetRef.kind
      name: Kind
      type: string
    - description: Name of the scale target
      jsonPath: .spec.scaleTargetRef.name
      name: Target
      type: string
    - description: Replica floor currently enforced
      jsonPath: .status.desiredMinReplicas
      name: Floor
      type: integer
    - description: Schedules currently in effect
      jsonPath: .status.activeSchedules
      name: Active
      type: string
    - description: Next time the floor changes
      jsonPath: .status.nextTransitionTime
      name: Next
      priority: 1
      type: date
    - description: Whether the floor is enforced
      jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: >-
          TimeBasedAutoscaler enforces a time-of-week dependent replica floor on a scale
          target.
        properties:
          spec:
            description: |-
              `TimeBasedAutoscaler` enforces a time-of-week dependent replica floor on a scale target.

              The floor is a lower bound only: horizontal autoscalers such as the
              `HorizontalPodAutoscaler` or KEDA remain free to scale above it.
            properties:
              minReplicas:
                description: Floor applied while no schedule is active.
                format: int32
                minimum: 0.0
                type: integer
              scaleTargetRef:
                description: |-
                  Reference to the scaled resource. Either a resource exposing the `scale`
                  subresource (`Deployment`, `StatefulSet`, `ReplicaSet`, custom resources), a
                  `HorizontalPodAutoscaler` (its `minReplicas` is managed) or a KEDA
                  `ScaledObject` (its `minReplicaCount` is managed).
                properties:
                  apiVersion:
                    description: API version of the referent, e.g. `apps/v1`.
                    maxLength: 253
                    minLength: 1
                    type: string
                  kind:
                    description: Kind of the referent, e.g. `Deployment`.
                    maxLength: 63
                    minLength: 1
                    type: string
                  name:
                    description: Name of the referent.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
              schedules:
                default: []
                description: |-
                  Time windows raising the floor. When several windows overlap, the
                  highest `minReplicas` wins. Times are evaluated in the controller's
                  configured time zone (`TBA_TIMEZONE`).
                items:
                  description: A recurring weekly time window with its replica floor.
                  properties:
                    days:
                      default:
                      - Monday
                      - Tuesday
                      - Wednesday
                      - Thursday
                      - Friday
                      - Saturday
                      - Sunday
                      description: Days on which the window starts. Defaults to every day.
                      items:
                        description: Day of the week.
                        enum:
                        - Monday
                        - Tuesday
                        - Wednesday
                        - Thursday
                        - Friday
                        - Saturday
                        - Sunday
                        type: string
                      maxItems: 7
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    end:
                      description: |-
                        Exclusive local end time, `HH:MM` (24-hour clock) or `24:00`. An end
                        earlier than the start describes a window crossing midnight.
                      maxLength: 5
                      minLength: 5
                      pattern: ^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$
                      type: string
                    minReplicas:
                      description: Floor applied while the window is active.
                      format: int32
                      minimum: 0.0
                      type: integer
                    name:
                      description: Unique name of the window, reported in `status.activeSchedules`.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    start:
                      description: Inclusive local start time, `HH:MM` (24-hour clock).
                      maxLength: 5
                      minLength: 5
                      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                      type: string
                  required:
                  - end
                  - minReplicas
                  - name
                  - start
                  type: object
                  x-kubernetes-validations:
                  - message: start and end must differ
                    rule: self.start != self.end
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - minReplicas
            - scaleTargetRef
            type: object
          status:
            description: |-
              Observed state of a [`TimeBasedAutoscaler`].

              Every field is always serialized (`null` or `[]` when unset) so that a JSON
              merge patch of the whole status clears fields that no longer apply.
            nullable: true
            properties:
              activeSchedules:
                default: []
                description: Names of the schedules in effect at the last reconciliation.
                items:
                  type: string
                type: array
              conditions:
                default: []
                description: Current state of the autoscaler.
                items:
                  description: >-
                    Condition contains details for one aspect of the current state of this API
                    Resource.
                  properties:
                    lastTransitionTime:
                      description: >-
                        lastTransitionTime is the last time the condition transitioned from one status
                        to another. This should be when the underlying condition changed.  If that is not
                        known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: >-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      type: string
                    observedGeneration:
                      description: >-
                        observedGeneration represents the .metadata.generation that the condition was
                        set based upon. For instance, if .metadata.generation is currently 12, but the
                        .status.conditions[x].observedGeneration is 9, the condition is out of date with
                        respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: >-
                        reason contains a programmatic identifier indicating the reason for the
                        condition's last transition. Producers of specific condition types may define expected
                        values and meanings for this field, and whether the values are considered a
                        guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              desiredMinReplicas:
                description: Floor in effect at the last reconciliation.
                format: int32
                nullable: true
                type: integer
              lastScaleTime:
                description: Last time the controller changed the target.
                format: date-time
                nullable: true
                type: string
              managedReplicas:
                description: |-
                  Replica count last written to a `scale` subresource target. The
                  controller only lowers replicas it raised itself, so manual or
                  autoscaler-driven scale-ups above the floor are preserved.
                format: int32
                nullable: true
                type: integer
              nextTransitionTime:
                description: Next time the floor changes. Absent when the floor is constant.
                format: date-time
                nullable: true
                type: string
              observedGeneration:
                description: Generation of the spec the status was computed from.
                format: int64
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: TimeBasedAutoscaler
        type: object
    served: true
    storage: true
    subresources:
      status: {}
