apiVersion: apps/v1
kind: Deployment
metadata:
  name: tba-controller
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: tba
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tba
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: tba-controller
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tba
              app.kubernetes.io/component: controller
      containers:
        - name: controller
          image: ghcr.io/alexandernicholson/tba:latest
          imagePullPolicy: IfNotPresent
          args: ["run"]
          env:
            # IANA time zone the schedules are evaluated in.
            - name: TBA_TIMEZONE
              value: UTC
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUST_LOG
              value: info
          ports:
            - name: http-metrics
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-metrics
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tba-controller
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tba
      app.kubernetes.io/component: controller
---
apiVersion: v1
kind: Service
metadata:
  name: tba-controller-metrics
spec:
  selector:
    app.kubernetes.io/name: tba
    app.kubernetes.io/component: controller
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
      protocol: TCP
